# PicoClaw 配置文件
# Web UI will be available at: http://localhost:18800

server:
  host: "0.0.0.0"
  port: 18800

provider:
  type: "openai"
  api_key: ""  # 在这里设置你的 API Key
  base_url: ""
  model: "gpt-4o-mini"

memory:
  type: "jsonl"
  max_entries: 1000
  file_path: "/etc/picoclaw/memory.jsonl"

security:
  allowed_ips: []  # 空表示允许所有访问
  max_tokens: 4096
  timeout: 60

logging:
  level: "info"
  file: "/var/log/picoclaw.log"
  max_size: 10
  max_backups: 3
  max_age: 7
